name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check test types
        run: npm run test:ui:typecheck
      - name: Build website
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        run: npm run test:ui
      - name: Save Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright/report/
          retention-days: 7
          if-no-files-found: ignore

  python-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: playwright_python/requirements.txt
      - name: Install website dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r playwright_python/requirements.txt
      - name: Install Chromium for Python
        run: python -m playwright install --with-deps chromium
      - name: Run Python UI tests
        run: python -m pytest --junitxml=playwright_python/test-results/junit.xml
      - name: Save Python test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-python-results
          path: playwright_python/test-results/
          retention-days: 7
          if-no-files-found: ignore
